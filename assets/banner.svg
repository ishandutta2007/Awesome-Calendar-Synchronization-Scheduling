<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .dynamic-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .dynamic-float {
      animation: float 6s ease-in-out infinite alternate;
    }
    .dynamic-dash {
      stroke-dasharray: 6 6;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.95); }
      100% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />

  <!-- Animated Glowing Orbs (Background depth) -->
  <g filter="url(#glow)">
    <circle cx="150" cy="120" r="140" fill="#3b82f6" class="dynamic-pulse" />
    <circle cx="1050" cy="280" r="160" fill="#8b5cf6" class="dynamic-pulse" style="animation-delay: -2s;" />
    <circle cx="600" cy="380" r="120" fill="#06b6d4" class="dynamic-pulse" style="animation-delay: -1s;" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Connecting Sync Lines -->
  <g class="dynamic-dash" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 120 300 C 300 240, 450 340, 600 290 S 900 220, 1080 270" />
    <path d="M 80 160 C 260 90, 480 180, 720 120 S 980 90, 1120 150" />
  </g>

  <!-- Left Floating Dynamic Visual Card: Sync Node -->
  <g class="dynamic-float" transform="translate(60, 100)">
    <rect width="160" height="180" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="80" cy="55" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
    <!-- Sync / Refresh Icon -->
    <path d="M 80 40 A 15 15 0 1 0 95 55 M 95 45 L 95 55 L 85 55" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="112" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="14">CalDAV &amp; ICS</text>
    <text x="80" y="132" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Two-Way Realtime</text>
    <rect x="35" y="148" width="90" height="16" rx="8" fill="#0369a1" fill-opacity="0.4" />
    <text x="80" y="160" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="10">SYNCHRONIZED</text>
  </g>

  <!-- Right Floating Dynamic Visual Card: Booking / Calendar Node -->
  <g class="dynamic-float" transform="translate(980, 100)" style="animation-delay: -3s;">
    <rect width="160" height="180" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="80" cy="55" r="28" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#subtleGlow)" />
    <!-- Calendar Icon -->
    <rect x="68" y="44" width="24" height="22" rx="3" fill="none" stroke="#c084fc" stroke-width="2" />
    <line x1="68" y1="52" x2="92" y2="52" stroke="#c084fc" stroke-width="2" />
    <line x1="74" y1="40" x2="74" y2="44" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <line x1="86" y1="40" x2="86" y2="44" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <circle cx="76" cy="58" r="1.5" fill="#38bdf8" />
    <circle cx="84" cy="58" r="1.5" fill="#38bdf8" />
    <text x="80" y="112" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="14">Auto-Schedule</text>
    <text x="80" y="132" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Group Poll &amp; Booking</text>
    <rect x="35" y="148" width="90" height="16" rx="8" fill="#7e22ce" fill-opacity="0.4" />
    <text x="80" y="160" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-weight="600" font-size="10">AUTOMATED</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed never obstructed) -->
  <g transform="translate(600, 110)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-118" cy="-2" r="5" fill="#10b981" />
      <text x="6" y="2" text-anchor="middle" fill="#e2e8f0" class="pill-text">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title with Gradient -->
    <text x="0" y="65" text-anchor="middle" fill="url(#primaryGrad)" class="title-text" filter="url(#subtleGlow)">
      Calendar Sync &amp; Scheduling
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="105" text-anchor="middle" class="subtitle-text">
      The definitive guide to SaaS platforms, CalDAV servers &amp; open-source booking engines
    </text>

    <!-- Dynamic Tech Feature Pills (Foreground) -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: CalDAV / CardDAV -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="pill-text">⚡ CalDAV Sync</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(-75, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#7c3aed" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#c084fc" class="pill-text">🚀 Open Source</text>
      </g>

      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(85, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#059669" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#34d399" class="pill-text">🔒 Self-Hosted</text>
      </g>

      <!-- Pill 4: Meeting Polls -->
      <g transform="translate(245, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#d97706" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" fill="#fbbf24" class="pill-text">📅 Smart Booking</text>
      </g>
    </g>
  </g>
</svg>
